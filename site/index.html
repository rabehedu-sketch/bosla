<script>
/* Bosla standalone runtime: provides the same window.claude.use() surface the page expects,
   backed by Supabase (docs table + auth). Without config, the site runs read-only with its built-in content. */
(function(){
  var cfg = window.BOSLA_CONFIG || {};
  var sb = (cfg.url && cfg.anonKey && window.supabase) ? window.supabase.createClient(cfg.url, cfg.anonKey) : null;
  var session = null, uid = null, adminP = null;
  var listeners = {}; // collection -> [{id|null, fn}]

  function snapOf(rows){ return { docs: rows.map(function(r){ return { id: r.id, data: function(){ return r.data; } }; }) }; }
  async function fetchCol(c){ var r = await sb.from("docs").select("id,data").eq("collection", c); if (r.error) throw r.error; return r.data || []; }
  async function notify(c){
    var ls = listeners[c]; if (!ls || !ls.length) return;
    var rows; try { rows = await fetchCol(c); } catch(e) { ls.forEach(function(l){ l.err && l.err(e); }); return; }
    ls.forEach(function(l){
      if (l.id == null) l.fn(snapOf(rows));
      else { var row = rows.find(function(r){ return r.id === l.id; }); l.fn({ id: l.id, exists: !!row, data: function(){ return row ? row.data : undefined; } }); }
    });
  }
  function listen(c, id, fn, err){
    (listeners[c] = listeners[c] || []).push({ id: id, fn: fn, err: err });
    notify(c);
    return function(){ listeners[c] = (listeners[c] || []).filter(function(l){ return l.fn !== fn; }); };
  }
  function split(p){ var i = p.lastIndexOf("/"); return [p.slice(0, i), p.slice(i + 1)]; }
  function docRef(c, id){
    return {
      id: id,
      set: async function(data){ var r = await sb.from("docs").upsert({ collection: c, id: id, data: data, updated_at: new Date().toISOString() }); if (r.error) throw r.error; notify(c); },
      update: async function(data){ var cur = await sb.from("docs").select("data").eq("collection", c).eq("id", id).maybeSingle(); var r = await sb.from("docs").upsert({ collection: c, id: id, data: Object.assign({}, cur.data && cur.data.data, data) }); if (r.error) throw r.error; notify(c); },
      delete: async function(){ var r = await sb.from("docs").delete().eq("collection", c).eq("id", id); if (r.error) throw r.error; notify(c); },
      onSnapshot: function(fn, err){ return listen(c, id, fn, err); }
    };
  }
  function colRef(c){
    return {
      path: c,
      doc: function(id){ return docRef(c, id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2))); },
      add: async function(data){ var d = this.doc(); await d.set(data); return d; },
      onSnapshot: function(fn, err){ return listen(c, null, fn, err); }
    };
  }
  var db = sb && {
    doc: function(p){ var s = split(p); return docRef(s[0], s[1]); },
    collection: function(p){ return colRef(p); }
  };

  async function isAdmin(){
    if (!uid) return false;
    if (!adminP) adminP = sb.rpc("is_admin").then(function(r){ return r.data === true; }, function(){ return false; });
    return adminP;
  }
  var user = sb && {
    id: async function(){ return uid; },
    isOwner: isAdmin,
    canEdit: isAdmin,
    me: async function(){ return { id: uid, email: session && session.user && session.user.email, name: "" }; },
    profiles: async function(ids){
      var out = {}; if (!ids || !ids.length) return out;
      var r = await sb.from("docs").select("id,data").eq("collection", "points").in("id", ids);
      (r.data || []).forEach(function(x){ out[x.id] = { id: x.id, name: (x.data && x.data.name) || "" }; });
      return out;
    }
  };
  var downloads = {
    save: async function(req){
      var blob = req.data instanceof Blob ? req.data : new Blob([req.data]);
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = req.filename || "file";
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return { status: "saved" };
    }
  };

  var ready = (async function(){
    if (!sb) return;
    var s = await sb.auth.getSession(); session = s.data.session; uid = session ? session.user.id : null;
    sb.auth.onAuthStateChange(function(ev, sess){
      var nid = sess ? sess.user.id : null;
      if (nid !== uid) location.reload();
    });
    try {
      sb.channel("docs-changes").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, function(p){
        var c = (p.new && p.new.collection) || (p.old && p.old.collection); if (c) notify(c);
      }).subscribe();
    } catch(e) {}
    setInterval(function(){ Object.keys(listeners).forEach(notify); }, 60000);
  })();

  window.claude = {
    use: async function(name){
      await ready;
      if (name === "db") return db || null;
      if (name === "user") return user || null;
      if (name === "downloads") return downloads;
      return null; // sample (AI advisor) is not available outside Claude
    }
  };

  /* ---- sign in / sign out ---- */
  var TX = {
    ar: { t: "تسجيل الدخول", p: "أدخل بريدك الإلكتروني ليصلك رابط الدخول.", e: "البريد الإلكتروني", b: "أرسل رابط الدخول", ok: "أرسلنا رابط الدخول إلى بريدك.", err: "تعذّر الإرسال، حاول بعد قليل.", out: "تسجيل الخروج", off: "تسجيل الدخول غير مفعّل بعد." },
    en: { t: "Sign in", p: "Enter your email to receive a sign-in link.", e: "Email", b: "Send sign-in link", ok: "We sent a sign-in link to your email.", err: "Couldn't send, please try again shortly.", out: "Sign out", off: "Sign-in isn't enabled yet." }
  };
  window.BOSLA_AUTH = {
    form: function(lang){
      var x = TX[lang] || TX.ar;
      if (!sb) return '<p class="note">' + x.off + "</p>";
      return '<div class="panel" style="max-width:460px"><h3>' + x.t + '</h3><p class="note" style="margin-top:4px">' + x.p + '</p><form class="form" id="loginForm" style="margin-top:10px"><label>' + x.e + '<input id="loginEmail" type="email" required dir="ltr" autocomplete="email"></label><div><button class="btn" type="submit">' + x.b + '</button></div></form></div>';
    },
    logout: function(lang){ var x = TX[lang] || TX.ar; return sb && uid ? '<button class="btn line" type="button" id="logoutBtn" style="font-size:13px;padding:5px 12px">' + x.out + "</button>" : ""; }
  };
  document.addEventListener("submit", async function(e){
    if (e.target.id !== "loginForm") return; e.preventDefault();
    var lang = document.documentElement.lang === "en" ? "en" : "ar", x = TX[lang];
    var email = document.getElementById("loginEmail").value.trim(); if (!email) return;
    var r = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin + location.pathname } });
    var tEl = document.getElementById("toast"); if (tEl) { tEl.textContent = r.error ? x.err : x.ok; tEl.classList.add("on"); setTimeout(function(){ tEl.classList.remove("on"); }, 3500); }
  });
  document.addEventListener("click", async function(e){
    if (e.target.closest && e.target.closest("#logoutBtn")) { await sb.auth.signOut(); location.reload(); }
  });
})();

</script>

<title>بوصلة القطاع غير الربحي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Layout: light sticky header with section tabs; hero carries a ripple motif: concentric rings spreading from a seed point. Single light look by design. Palette: cream / navy / copper / sage */
:root{
  color-scheme:light;
  --bg:#FAF8F2; --surface:#FFFFFF; --fg:#2A2F3A; --muted:#676B74; --line:#EAE4D6;
  --navy:#0F3557; --copper:#BA6740; --copper-soft:#F6E9DF; --navy-soft:#E8EEF4;
  --sage:#5E8B6E; --sage-soft:#E6F0E8; --sand:#F1E7D6;
  --ok:#2F7D55; --ok-soft:#E1F0E7; --warn:#A86A12; --warn-soft:#F8EDD8;
  --head:#FFFFFF; --head-fg:#0F3557; --head-muted:#7A7F88;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --latin:"Montserrat","IBM Plex Sans Arabic",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.65;margin:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
[lang="en"] body,[dir="ltr"]{font-family:var(--latin)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);color:var(--head-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand{gap:12px}.brand .mark{filter:drop-shadow(0 2px 6px rgba(15,53,87,.18))}.brand .wm{display:flex;flex-direction:column;min-width:0}.brand .nm{display:flex;align-items:baseline;gap:9px}.brand b{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.01em;color:var(--head-fg)}.brand .latin{font-family:var(--latin);font-size:11px;font-weight:700;letter-spacing:.32em;color:#BA6740}.brand .wm small{margin-top:5px}@media(max-width:560px){.brand .mark{width:46px;height:46px}.brand b{font-size:25px}.brand .wm small{font-size:10.5px;max-width:190px;line-height:1.35}.brand .latin{font-size:9.5px;letter-spacing:.25em}}
.brand small{display:block;font-size:12px;color:var(--head-muted);font-weight:400}
.lang{font:inherit;font-size:13px;font-weight:600;background:transparent;color:var(--head-fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.lang:hover{border-color:var(--copper);color:var(--copper)}
.lang:focus-visible,nav button:focus-visible{outline:2px solid #BA6740;outline-offset:2px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:14px;background:none;border:0;color:var(--head-fg);opacity:.7;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button:hover{opacity:1}
nav button[aria-selected="true"]{opacity:1;border-bottom-color:#BA6740;font-weight:600}
main{padding-block:26px 120px}
h1{font-size:28px;line-height:1.3;margin:0 0 10px;text-wrap:balance}
h2{font-size:20px;margin:0 0 6px;color:var(--navy);text-wrap:balance;display:flex;align-items:center;gap:10px}
h2::before{display:none;content:"";flex:none;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,var(--copper) 0 3px,transparent 3.5px),radial-gradient(circle,transparent 5px,rgba(186,103,64,.45) 5.5px 6.5px,transparent 7px),radial-gradient(circle,transparent 8px,rgba(94,139,110,.4) 8.5px 9px,transparent 9.5px)}
h3{font-size:16px;margin:0;text-wrap:balance}
.lead{color:var(--muted);max-width:65ch;margin:0 0 18px}
.section{margin-bottom:34px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#FFFFFF 0%,var(--sand) 55%,var(--copper-soft) 100%);color:var(--navy);border:1px solid var(--line);border-radius:20px;padding:34px 28px;display:grid;gap:16px;margin-bottom:34px}
.hero>*{position:relative;z-index:1;max-width:560px}
.hero .eyebrow{font-size:13px;font-weight:600;color:var(--sage);letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px}
.hero .eyebrow::before{content:"";width:22px;height:2px;background:var(--sage);border-radius:2px}
.hero h1{font-size:32px}
.hero h1 em{font-style:normal;color:var(--copper)}
.hero p{color:var(--muted);margin:0;max-width:56ch}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.ripple{position:absolute;z-index:0;inset-block:-40px;inset-inline-end:-80px;width:440px;max-width:none;pointer-events:none;opacity:.9}
.ripple circle.r{fill:none;stroke-width:1.5;transform-origin:220px 220px;animation:pulse 6s ease-out infinite}
.ripple circle.r:nth-child(2){animation-delay:1.5s}.ripple circle.r:nth-child(3){animation-delay:3s}.ripple circle.r:nth-child(4){animation-delay:4.5s}
@keyframes pulse{0%{transform:scale(.25);opacity:.9}100%{transform:scale(1);opacity:0}}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:4px}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:24px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:12px;color:var(--muted)}
@media (max-width:600px){.ripple{width:300px;inset-inline-end:-120px;opacity:.45}.hero h1{font-size:24px}.hero{padding:26px 20px}}
.btn{font:inherit;font-size:14px;font-weight:600;background:var(--copper);color:#fff;border:0;border-radius:8px;padding:8px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.line{background:transparent;color:inherit;border:1px solid currentColor}
.btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{border-color:rgba(15,53,87,.25)}
.card.soon{background:linear-gradient(160deg,var(--surface),var(--sage-soft))}
.card p{margin:0;color:var(--muted);font-size:14px}
article.card{border-top:3px solid var(--accent-top,var(--line))}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-weight:600;white-space:nowrap}
.tag.cu{background:var(--copper-soft);color:var(--copper)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meta div{background:var(--bg);border-radius:8px;padding:6px 8px;font-size:12px;text-align:center}
.meta span{display:block;color:var(--muted);font-size:11px}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.link{color:var(--copper);font-weight:600;text-decoration:none;font-size:14px}
.link:hover{text-decoration:underline}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--copper);width:16px;height:16px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font:inherit;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--fg);padding:4px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.chip:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;counter-increment:s}
.step::before{content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--copper-soft);color:var(--copper);font-weight:700;font-size:13px;margin-bottom:6px;box-shadow:0 0 0 4px var(--surface),0 0 0 5px rgba(186,103,64,.3)}
.step:nth-child(even)::before{background:var(--sage-soft);color:var(--sage);box-shadow:0 0 0 4px var(--surface),0 0 0 5px rgba(94,139,110,.35)}
.step p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.soon{border-style:dashed}
.tray{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tray .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;flex-wrap:wrap}
.cmp{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:24px}
.cmp table{width:100%;border-collapse:collapse;min-width:560px}
.cmp th,.cmp td{padding:10px 12px;border-top:1px solid var(--line);text-align:start;vertical-align:top;font-size:14px}
.cmp tr:first-child th,.cmp tr:first-child td{border-top:0}
.cmp th{color:var(--muted);font-weight:600;width:130px;background:var(--bg)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
details+details{margin-top:10px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--copper);font-weight:700}
details[open] summary::after{content:"−"}
details p,details li{color:var(--muted);font-size:14px}
pre.tpl{white-space:pre-wrap;direction:ltr;text-align:left;font-family:var(--latin);font-size:13px;background:var(--bg);border-radius:8px;padding:14px;margin:12px 0 8px;line-height:1.7;overflow-x:auto}
.search{font:inherit;width:100%;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);margin-bottom:14px}
.search:focus{outline:2px solid var(--copper);outline-offset:1px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.term b{display:block}
.term .en{font-family:var(--latin);color:var(--copper);font-weight:600;direction:ltr;text-align:start;display:block}
.term p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.q+.q{margin-top:8px}
.q span{flex:1;min-width:200px}
.yn{display:flex;gap:6px}
.result{background:linear-gradient(135deg,var(--sage-soft),var(--surface));border:1px solid var(--line);color:var(--navy);border-radius:16px;padding:22px;margin-top:18px}
.result .score{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--sage)}
.result ul{margin:10px 0 0;padding-inline-start:20px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){.ripple circle.r{animation:none;transform:scale(.6);opacity:.5}.card:hover{transform:none}}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.voices{background:linear-gradient(160deg,var(--surface),var(--sand));border:1px solid var(--line);border-radius:20px;padding:24px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.avg{display:flex;align-items:center;gap:10px}
.avg b{font-size:34px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.avg small{color:var(--muted);font-size:13px;display:block}
.stars{color:#D9A441;letter-spacing:2px;font-size:16px;white-space:nowrap}
.stars .off{color:#E2DCCB}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.review{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.review::before{content:"”";position:absolute;inset-inline-end:14px;top:2px;font-size:54px;line-height:1;color:var(--copper-soft);font-family:Georgia,serif}
.review p{margin:0;color:var(--fg);font-size:14px;position:relative}
.who{display:flex;align-items:center;gap:10px;margin-top:auto}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sage-soft);color:var(--sage);flex:none}
.review:nth-child(even) .av{background:var(--copper-soft);color:var(--copper)}
.who b{display:block;font-size:14px}
.who small{color:var(--muted);font-size:12px}
.mine{font-size:11px;color:var(--sage);font-weight:600}

/* catalog = static + admin additions */
function programs(){return [...BASE,...R.extra.map(x=>({id:x.id,type:x.type||"course",region:x.region||"local",status:x.status||"new",cost:x.cost||"check",mode:x.mode||"check",lng:x.lng||"arabic",fields:Array.isArray(x.fields)?x.fields:[],country:{ar:x.country||"",en:x.country||""},name:{ar:x.name,en:x.name_en||x.name},provider:{ar:x.provider||"",en:x.provider||""},focus:{ar:x.desc||"",en:x.desc||""},url:x.url,start:x.start||""}))]}
function resolve(ref){const [k,id]=ref.split(":");
 if(k==="P"){const p=programs().find(x=>x.id===id);return p&&{id:ref,name:p.name,sub:p.provider,url:p.url}}
 if(k==="L"){const p=PLATFORMS.find(x=>x.id===id);return p&&{id:ref,name:p.name,sub:{ar:"منصة تعلم عن بعد",en:"E-learning platform"},url:p.url}}
 if(k==="C"){const p=CONTENT.find(x=>x.id===id);return p&&{id:ref,name:p.name,sub:p.by,url:p.url}}
 if(k==="N"){const p=NETWORKS.find(x=>x.id===id);return p&&{id:ref,name:p.name,sub:{ar:"شبكة مهنية",en:"Professional network"},url:p.url}}}
const jItems=j=>j.stages.flatMap(s=>s.items);
const jDoneList=jid=>((R.prefs.journeys||{})[jid]||{}).done||[];
const jPct=j=>{const all=jItems(j);return all.length?Math.round(jDoneList(j.id).filter(x=>all.includes(x)).length/all.length*100):0};
const itemById=id=>programs().find(p=>p.id===id)||EVENTS.find(e=>e.id===id);
const follows=()=>Array.isArray(R.prefs.follows)?R.prefs.follows:[];
const isFollowing=id=>follows().includes(id);
const followBtn=id=>`<button class="follow" type="button" data-follow="${id}" aria-pressed="${isFollowing(id)}">${isFollowing(id)?"✓ "+t("following"):t("follow")}</button>`;

/* ratings of programs */
function ratingOf(pid){const xs=R.ratings.map(r=>Number((r.r||{})[pid])||0).filter(Boolean);return{n:xs.length,avg:xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0}}
const myRating=pid=>Number(((R.ratings.find(r=>r.id===R.uid)||{}).r||{})[pid])||0;
async function rateProgram(pid,n){
 if(!R.db||!R.uid){toast(t("login"));return}
 const cur=(R.ratings.find(r=>r.id===R.uid)||{}).r||{};
 try{await R.db.doc("ratings/"+R.uid).set({r:{...cur,[pid]:n}});award("rate_"+pid,POINTS.rate)}catch(_){toast(t("vErr"))}
}
const starStr=n=>`<span class="stars" aria-label="${n}/5">${"★".repeat(n)}<span class="off">${"★".repeat(5-n)}</span></span>`;

/* ---------- program card ---------- */
function programCard(p){
 const on=S.cmp.includes(p.id);
 const mode=["online","onsite","hybrid"].includes(p.mode)?t(p.mode):t("checkSite");
 const cost=p.cost==="free"?t("free"):p.cost==="paid"?t("paid"):t("checkSite");
 const rt=ratingOf(p.id),mine=myRating(p.id);
 const canApply=p.type!=="directory";
 return `<article class="card" style="--accent-top:${({masters:"#0F3557",bachelor:"#0F3557",diploma:"#2F7D8C",certificate:"#5E8B6E",course:"#BA6740",training:"#BA6740",fellowship:"#A86A12",scholarship:"#7A5C9E",academy:"#2F7D8C",award:"#7A5C9E"})[p.type]||"var(--line)"}">
  <div class="tags"><span class="tag">${t(p.type)}</span><span class="tag ${p.region==="local"?"cu":""}">${t(p.region)}</span>${p.status!=="existing"?`<span class="tag soonT">${t("st_"+p.status)}</span>`:""}${p.cost==="free"?`<span class="tag ok">${t("free")}</span>`:""}${p.fields.slice(0,2).map(f=>`<span class="tag" style="background:var(--sage-soft);color:var(--sage)">${t(f)}</span>`).join("")}</div>
  <h3>${esc(L(p.name))}</h3>
  <p>${esc(L(p.provider))}${L(p.country)?" · "+esc(L(p.country)):""}</p>
  <p>${esc(L(p.focus))}</p>
  <div class="meta"><div><span>${t("lang")}</span>${t(p.lng)}</div><div><span>${t("mode")}</span>${mode}</div><div><span>${t(p.fee?"fee":"cost")}</span>${p.fee?esc(L(p.fee)):cost}</div>${p.duration?`<div><span>${t("duration")}</span>${esc(L(p.duration))}</div>`:""}</div>
  ${canApply?`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="rsum">${rt.n?`${starStr(Math.round(rt.avg))} ${rt.avg.toFixed(1)} · ${rt.n} ${t("ratings")}`:t("rateIt")}</span>
   <span class="myrate" role="group" aria-label="${t("rateIt")}">${[1,2,3,4,5].map(n=>`<button type="button" data-rate="${p.id}" data-n="${n}" class="${n<=mine?"on":""}" aria-label="${n}">★</button>`).join("")}</span></div>`:""}
  <div class="cardfoot">${canApply?`<a class="btn apply" href="${esc(p.url)}" target="_blank" rel="noopener">${t("apply")} ${arrow()}</a>`:`<a class="link" href="${esc(p.url)}" target="_blank" rel="noopener">${t("visit")} ${arrow()}</a>`}
   <div style="display:flex;gap:10px;align-items:center">${canApply?followBtn(p.id):""}${canApply?`<label class="chk"><input type="checkbox" id="c-${p.id}" data-cmp="${p.id}" ${on?"checked":""}> ${t("compareAdd")}</label>`:""}</div></div>
 </article>`;
}
function comparison(){
 const ps=programs().filter(p=>S.cmp.includes(p.id));
 if(ps.length<2)return "";
 const row=(k,f)=>`<tr><th>${t(k)}</th>${ps.map(p=>`<td>${f(p)}</td>`).join("")}</tr>`;
 return `<div id="cmpBox"><h2>${t("cmpT")}</h2><div class="cmp"><table>
  <tr><th></th>${ps.map(p=>`<td><b>${esc(L(p.name))}</b></td>`).join("")}</tr>
  ${row("provider",p=>esc(L(p.provider)))}${row("type",p=>t(p.type))}${row("status",p=>t("st_"+p.status))}${row("region",p=>t(p.region))}
  ${row("mode",p=>p.mode==="online"?t("online"):t("checkSite"))}${row("cost",p=>p.cost==="free"?t("free"):p.cost==="paid"?t("paid"):t("checkSite"))}
  ${row("lang",p=>t(p.lng))}${row("ratings",p=>{const r=ratingOf(p.id);return r.n?r.avg.toFixed(1)+" / 5":"—"})}${row("focus",p=>esc(L(p.focus)))}
 </table></div></div>`;
}

const myPoints=()=>((R.board||[]).find(b=>b.id===R.uid)||{}).points||0;
const nameOf=id=>id===R.uid?t("you"):(R.names[id]||t("someone"));
function boardHTML(limit){
 if(R.board===null)return `<p class="note">${t("vLoading")}</p>`;
 const L2=[...R.board].filter(b=>(b.points||0)>0).sort((a,b)=>(b.points||0)-(a.points||0)).slice(0,limit||10);
 if(!L2.length)return `<p class="note">${t("lbEmpty")}</p>`;
 return `<div class="lb">${L2.map((b,i)=>`<div class="r ${b.id===R.uid?"me":""}"><span class="rk">${i+1}</span><span class="nm">${esc(nameOf(b.id))}</span><span class="pt">${b.points} <small style="color:var(--muted);font-weight:400">${t("pts")}</small></span></div>`).join("")}</div>`;
}
function earnHTML(){return `<h3 style="margin:0 0 8px">${t("earnT")}</h3><ul class="earn">${[["e_step",POINTS.step],["e_rate",POINTS.rate],["e_profile",POINTS.profile],["e_follow",POINTS.follow],["e_review",POINTS.review]].map(([k,n])=>`<li>${t(k)}<b>+${n}</b></li>`).join("")}</ul>`}
function acKpi(){
 const sorted=[...(R.board||[])].filter(b=>(b.points||0)>0).sort((a,b)=>(b.points||0)-(a.points||0));
 const rank=sorted.findIndex(b=>b.id===R.uid);
 return `<div><b>${myPoints()}</b><span>${t("kPoints")}</span></div><div><b>${rank>=0?rank+1:"—"}</b><span>${t("kRank")}</span></div><div><b>${doneSteps().length}</b><span>${t("kDone")}</span></div>`;
}
async function resolveNames(){
 if(!R.user||!R.board)return;
 const ids=R.board.map(b=>b.id).filter(id=>id!==R.uid&&!(id in R.names));if(!ids.length)return;
 try{const ps=await R.user.profiles(ids);ids.forEach(id=>{R.names[id]=(ps&&ps[id]&&ps[id].name)||""});refreshBoard()}catch(_){}
}
function refreshBoard(){if(S.tab==="home"&&!$("boardBox")&&(R.board||[]).filter(x=>(x.points||0)>0).length>=3&&!document.activeElement?.closest?.("form")){rerender();return}const b=$("boardBox");if(b)b.innerHTML=boardHTML(S.tab==="account"?10:5);if($("acKpi"))$("acKpi").innerHTML=acKpi()}
async function award(key,n){
 if(!R.db||!R.uid)return;
 const cur=(R.board||[]).find(b=>b.id===R.uid)||{points:0,awarded:{}};
 if(cur.awarded&&cur.awarded[key])return;
 const next={points:(cur.points||0)+n,awarded:{...(cur.awarded||{}),[key]:true},name:((R.prefs.profile||{}).name||"")};
 const i=(R.board||[]).findIndex(b=>b.id===R.uid);if(R.board){if(i>=0)R.board[i]={id:R.uid,...next};else R.board.push({id:R.uid,...next})}
 try{await R.db.doc("points/"+R.uid).set(next);toast(t("gained",{n}))}catch(_){}
}

/* ---------- notifications ---------- */
function alerts(){return follows().map(itemById).filter(x=>x&&x.date&&!isPast(x)&&daysTo(x.date)<=30).sort((a,b)=>a.date.localeCompare(b.date))}
function updateBell(){const n=alerts().length;const d=$("bellDot");d.hidden=!n;d.textContent=n;if(!$("bellPop").hidden)$("bellPop").innerHTML=bellHTML()}
function bellHTML(){const A=alerts();return `<h3>${t("nT")}</h3>${A.length?A.map(e=>`<div class="it"><span>${esc(L(e.name))}</span><small>${daysTo(e.date)<=0?t("today"):t("daysLeft",{n:daysTo(e.date)})}</small></div>`).join(""):`<p class="note" style="margin:0">${t("nNone")}</p>`}<div style="margin-top:10px"><button class="btn line" type="button" data-go="account" style="font-size:13px;padding:5px 12px">${t("nAll")}</button></div>`}

/* ---------- render ---------- */
const HIDDEN=["journeys","funders","grants","orgs"];
const canSee=k=>R.owner||!HIDDEN.includes(k);
const VIEWS={grants,readiness,providers:providersView,home,journeys:journeysView,programs:programsView,calendar:calendarView,communities:communitiesView,content:contentView,elearn:elearnView,funders:fundersView,orgs:orgsView,account:accountView};
function render(){
 const app=$("app");app.dir=S.lang==="ar"?"rtl":"ltr";app.lang=S.lang;document.documentElement.lang=S.lang;
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 $("langBtn").textContent=S.lang==="ar"?"English":"العربية";
 $("bellBtn").setAttribute("aria-label",t("nT"));$("meBtn").setAttribute("aria-label",t("account"));
 if(!canSee(S.tab))S.tab="home";
 $("tabs").innerHTML=TABS.filter(k=>k!=="account"&&canSee(k)).map(k=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${t(k)}${HIDDEN.includes(k)?` <small style="opacity:.6">(${t("hiddenTag")})</small>`:""}</button>`).join("");
 const y=window.scrollY;$("view").innerHTML=VIEWS[S.tab]();
 $("tray").hidden=S.tab!=="programs"||S.cmp.length===0;
 $("trayText").textContent=`${S.cmp.length} ${t("compareN")}`;$("clearCmp").textContent=t("clear");$("goCmp").textContent=t("compareGo");
 updateBell();renderBnav();return y;
}
function rerender(){const y=window.scrollY;render();window.scrollTo({top:y})}
const BNAV=[["home",'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],["programs",'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>'],["calendar",'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],["account",'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>']];
function renderBnav(){const n=$("bnav");if(!n)return;n.innerHTML=BNAV.map(([k,ic])=>`<button type="button" data-tab="${k}" ${S.tab===k?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic}</svg>${t(k)}</button>`).join("")}
function go(tab){if(!canSee(tab))tab="home";S.tab=tab;$("bellPop").hidden=true;try{history.replaceState(null,"","#"+tab)}catch(e){}render();window.scrollTo({top:0})}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
 const pv=e.target.closest("[data-prov]");if(pv){S.pq=pv.dataset.prov;S.status="all";S.filter="all";S.region="all";S.fields=[];S.tab="programs";rerender();scrollTo({top:0,behavior:"smooth"});return}
  const b=e.target.closest("[data-tab],[data-go],[data-filter],[data-region],[data-status],[data-follow],[data-star],[data-rate],[data-openj],[data-startj],[data-step],[data-joinc],[data-level],[data-delemp],[data-ans],[data-sg]");
 if(b){
  const d=b.dataset;
  if(d.tab){if(d.region){S.region=d.region;S.status="all";S.filter="all"}go(d.tab)}
  else if(d.go)go(d.go);
  else if(d.filter){S.filter=d.filter;rerender()}
  else if(d.region){S.region=d.region;rerender()}
  else if(d.status){S.status=d.status;rerender()}
  else if(d.follow){const on=isFollowing(d.follow);const ok=await savePrefs({follows:on?follows().filter(x=>x!==d.follow):[...follows(),d.follow]});if(ok){if(!on)award("follow_"+d.follow,POINTS.follow);rerender()}}
  else if(d.star){R.rating=Number(d.star);document.querySelectorAll("[data-star]").forEach(x=>x.classList.toggle("on",Number(x.dataset.star)<=R.rating))}
  else if(d.rate)rateProgram(d.rate,Number(d.n));
  else if(d.openj){S.openJ=S.openJ===d.openj?null:d.openj;if(S.tab!=="journeys")go("journeys");else rerender();setTimeout(()=>$("jDetail")?.scrollIntoView({behavior:"smooth",block:"start"}),40)}
  else if(d.startj){const js={...(R.prefs.journeys||{})};js[d.startj]=js[d.startj]||{done:[]};if(await savePrefs({journeys:js}))rerender()}
  else if(d.step){const [jid,ref]=d.step.split("|");const js={...(R.prefs.journeys||{})};const cur=js[jid]||{done:[]};const has=cur.done.includes(ref);
   js[jid]={done:has?cur.done.filter(x=>x!==ref):[...cur.done,ref]};if(await savePrefs({journeys:js})){if(!has)award("step_"+ref,POINTS.step);rerender()}}
  else if(d.joinc){const cs=Array.isArray(R.prefs.communities)?R.prefs.communities:[];const on=cs.includes(d.joinc);const next=on?cs.filter(x=>x!==d.joinc):[...cs,d.joinc];
   if(await savePrefs({communities:next})){try{await R.db.doc("members/"+R.uid).set({c:next})}catch(_){}rerender()}}
  else if(d.level){if(await savePrefs({profile:{...(R.prefs.profile||{}),level:d.level}}))rerender()}
  else if(d.ans){S.answers[d.ans]=d.v==="1";rerender();if(Object.keys(S.answers).length===QUESTIONS.ar.length)award("ready",POINTS.ready)}
  else if(d.sg){reviewSuggestion(d.sg,d.act)}
  else if(d.delemp){const plan=[...(R.prefs.orgplan||[])];plan.splice(Number(d.delemp),1);if(await savePrefs({orgplan:plan}))rerender()}
  return;
 }
 const id=e.target.closest("button")?.id;
 if(id==="langBtn"){S.lang=S.lang==="ar"?"en":"ar";try{localStorage.setItem("bosla-lang",S.lang)}catch(_){}rerender()}
 else if(id==="bellBtn"){const p=$("bellPop");p.hidden=!p.hidden;if(!p.hidden)p.innerHTML=bellHTML()}
 else if(id==="meBtn")go("account");
 else if(id==="clearCmp"){S.cmp=[];rerender()}
 else if(id==="goCmp"){if(S.cmp.length<2){toast(t("cmpEmpty"));return}setTimeout(()=>$("cmpBox")?.scrollIntoView({behavior:"smooth"}),30)}
 else if(id==="glMore"){S.glAll=true;rerender()}
 else if(id==="copyTpl"){try{navigator.clipboard.writeText(MOTIVATION).then(()=>toast(t("copied")),()=>{selectTpl();toast(t("copyFail"))})}catch(_){selectTpl();toast(t("copyFail"))}}
 else if(id==="rDel"&&R.db&&R.uid){const btn=e.target.closest("button");if(btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.textContent=S.lang==="ar"?"تأكيد الحذف":"Confirm delete";return}
  try{await R.db.doc("reviews/"+R.uid).delete();R.rating=0;$("vForm").innerHTML="";toast(t("vDeleted"))}catch(_){toast(t("vErr"))}}
 else if(id==="advBtn")runAdvisor();
 else if(id==="cvBtn")downloadCV();
 if(!e.target.closest("#bellPop,#bellBtn"))$("bellPop").hidden=true;
});
function selectTpl(){const r=document.createRange();r.selectNodeContents($("tplText"));const s=getSelection();s.removeAllRanges();s.addRange(r)}
document.addEventListener("change",e=>{
 const id=e.target.dataset.cmp,f=e.target.dataset.field;
 if(f){S.fields=e.target.checked?[...S.fields,f]:S.fields.filter(x=>x!==f);rerender();return}
 if(!id)return;
 if(e.target.checked){if(S.cmp.length>=3){e.target.checked=false;toast(t("cmpMax"));return}S.cmp.push(id)}else S.cmp=S.cmp.filter(x=>x!==id);
 rerender();
});
document.addEventListener("input",e=>{if(e.target.id==="glq"){S.q=e.target.value;$("glList").innerHTML=glossItems(glossFilter())}});
document.addEventListener("submit",async e=>{
 const f=e.target.id;if(!["rform","prForm","needForm","intForm","empForm","adForm"].includes(f))return;e.preventDefault();
 const v=id=>($(id)?.value||"").trim();
 if(f==="rform"){const name=v("rName"),role=v("rRole"),text=v("rText");if(!name||!text||!R.rating){toast(t("vNeed"));return}
  try{await R.db.doc("reviews/"+R.uid).set({name,role,text,rating:R.rating,at:Date.now()});toast(t("vSent"));document.activeElement?.blur();$("vForm").innerHTML=voicesForm();award("review",POINTS.review)}catch(_){toast(t("vErr"))}}
 else if(f==="prForm"){const prof={...(R.prefs.profile||{}),name:v("pName"),title:v("pTitle"),org:v("pOrg"),city:v("pCity"),bio:v("pBio")};
  if(await savePrefs({profile:prof})){toast(t("pSaved"));if(prof.name&&prof.title&&prof.org)award("profile",POINTS.profile);rerender()}}
 else if(f==="needForm"){const topic=v("nTopic");if(!topic||!R.db)return;try{await R.db.doc("needs/"+R.uid).set({topic,journey:$("nJ").value,at:Date.now()});toast(t("needSent"));award("need",POINTS.need)}catch(_){toast(t("vErr"))}}
 else if(f==="intForm"){const name=v("iName"),org=v("iOrg");if(!name||!org)return;try{await R.db.doc("interest/"+R.uid).set({name,org,area:$("iArea").value,note:v("iNote"),at:Date.now()});toast(t("intSent"));e.target.reset()}catch(_){toast(t("vErr"))}}
 else if(f==="empForm"){const n=v("empName");if(!n)return;const plan=[...(R.prefs.orgplan||[]),{n,j:$("empJ").value}];if(await savePrefs({orgplan:plan})){toast(t("planSaved"));rerender()}}
 else if(f==="adForm"){const name=v("adName"),url=v("adUrl");if(!name||!url){toast(t("adNeed"));return}
  try{await R.db.collection("catalog").add({name,provider:v("adProv"),url,desc:v("adDesc"),start:v("adStart"),status:$("adStatus").value,type:$("adType").value,region:$("adRegion").value,lng:$("adLng").value,fields:[],at:Date.now()});toast(t("adAdded"));e.target.reset()}catch(_){toast(t("vErr"))}}
});

/* ---------- advisor & CV ---------- */
async function runAdvisor(){
 const p=R.prefs.profile||{};if(!p.title&&!p.bio){toast(t("advNeed"));return}
 S.advBusy=true;rerender();
 const catalog=[...programs().filter(x=>x.type!=="directory").map(x=>({ref:"P:"+x.id,name:x.name.ar,provider:x.provider.ar,focus:x.focus.ar})),...PLATFORMS.map(x=>({ref:"L:"+x.id,name:x.name.ar,focus:x.desc.ar})),...CONTENT.map(x=>({ref:"C:"+x.id,name:x.name.ar,focus:x.desc.ar}))];
 const prompt=`You are an educational advisor for people working in the Saudi nonprofit sector.
Profile: title="${p.title||""}", organization="${p.org||""}", career stage="${t(p.level||"lv_beg")}", bio="${p.bio||""}".
Journeys started: ${JOURNEYS.filter(j=>(R.prefs.journeys||{})[j.id]).map(j=>j.name.ar).join(", ")||"none"}. Already completed: ${doneSteps().join(", ")||"none"}.
Catalog (use only these refs): ${JSON.stringify(catalog)}
Recommend 3 to 5 next items, in order, not already completed. Write in ${S.lang==="ar"?"clear Modern Standard Arabic":"English"}.
Return JSON only: {"summary":"one sentence","steps":[{"ref":"P:id","why":"one short sentence"}]}`;
 try{S.advice=await R.sample.json(prompt,{modelTier:"quick"})}catch(_){S.advice={error:true}}
 S.advBusy=false;if(S.tab==="account")rerender();
}
async function downloadCV(){
 const p=R.prefs.profile||{};const done=doneSteps().map(resolve).filter(Boolean);
 const js=JOURNEYS.filter(j=>(R.prefs.journeys||{})[j.id]);
 const html=`<html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${esc(p.name||"CV")}</title><style>body{font-family:Arial,sans-serif;color:#2A2F3A;line-height:1.6}h1{color:#0F3557;margin:0}h2{color:#BA6740;border-bottom:1px solid #EAE4D6;padding-bottom:4px}</style></head><body>
 <h1>${esc(p.name||"")}</h1><p>${esc([p.title,p.org,p.city].filter(Boolean).join(" · "))}</p>
 ${p.bio?`<h2>نبذة</h2><p>${esc(p.bio)}</p>`:""}<h2>المرحلة المهنية</h2><p>${esc(T.ar[p.level||"lv_beg"])}</p>
 ${js.length?`<h2>الرحلات التعليمية</h2><ul>${js.map(j=>`<li>${esc(j.name.ar)} (${jPct(j)}%)</li>`).join("")}</ul>`:""}
 <h2>البرامج المنجزة</h2>${done.length?`<ul>${done.map(d=>`<li>${esc(d.name.ar)} – ${esc(d.sub.ar)}</li>`).join("")}</ul>`:"<p>—</p>"}
 <p style="color:#888;font-size:12px">بوصلة</p></body></html>`;
 try{await R.downloads.save({filename:`${(p.name||"cv").replace(/[\\/:*?"<>|]/g,"")}-bosla.doc`,data:new Blob([html],{type:"application/msword"})})}catch(err){if(err?.code!=="declined")toast(t("cvFail"))}
}

document.addEventListener("click",e=>{const b=e.target.closest("[data-type]");if(!b)return;S.pq="";S.status="all";S.filter=b.dataset.type;S.region="all";S.fields=[];go("programs")});
document.addEventListener("click",e=>{const b=e.target.closest("[data-topic]");if(!b)return;S.pq="";S.status="all";S.filter="all";S.region="all";S.fields=[b.dataset.topic];go("programs")});
document.addEventListener("submit",e=>{if(e.target.id!=="heroSearch")return;e.preventDefault();S.pq=($("heroQ").value||"").trim();S.status="all";S.filter="all";S.region="all";S.fields=[];go("programs")});
document.addEventListener("input",e=>{if(e.target.id!=="pq")return;S.pq=e.target.value;const pos=e.target.selectionStart;rerender();const el=$("pq");if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}});
/* ---------- boot ---------- */
try{const l=localStorage.getItem("bosla-lang");if(l==="en"||l==="ar")S.lang=l}catch(e){}
const h=(location.hash||"").slice(1);if(TABS.includes(h))S.tab=h;
render();
(async()=>{
 const use=n=>window.claude?.use?.(n);
 const db=await use("db");
 if(!db){R.list=[];R.board=[];refreshVoices();refreshBoard();return}
 R.db=db;
 try{R.user=await use("user");R.uid=R.user?await R.user.id():null;R.owner=R.user?await R.user.isOwner():false}catch(_){R.uid=null}
 use("sample").then(s=>{R.sample=s||null;if(S.tab==="account")rerender()});
 use("downloads").then(s=>{R.downloads=s||null;if(S.tab==="account")rerender()});
 const keep=fn=>(snap)=>{fn(snap.docs.map(d=>({id:d.id,...d.data()})))};
 db.collection("reviews").onSnapshot(keep(x=>{R.list=x.sort((a,b)=>(b.at||0)-(a.at||0));refreshVoices()}),()=>{R.list=R.list||[];refreshVoices()});
 db.collection("points").onSnapshot(keep(x=>{R.board=x;refreshBoard();resolveNames()}),()=>{R.board=R.board||[];refreshBoard()});
 const soft=()=>{if(["programs","communities","funders","account"].includes(S.tab)&&!document.activeElement?.closest?.("form"))rerender()};
 db.collection("ratings").onSnapshot(keep(x=>{R.ratings=x;soft()}));
 db.collection("members").onSnapshot(keep(x=>{R.members=x;soft()}));
 db.collection("needs").onSnapshot(keep(x=>{R.needs=x.sort((a,b)=>(b.at||0)-(a.at||0));soft()}));
 if(R.owner){let SG=[],DONE={};const upd=()=>{R.suggest=SG.filter(y=>y&&y.id&&y.name&&y.url&&!DONE[y.id]).sort((a,b)=>(b.at||0)-(a.at||0));soft()};fetch("suggestions.json",{cache:"no-store"}).then(r=>r.ok?r.json():[]).then(x=>{SG=Array.isArray(x)?x:[];upd()}).catch(()=>{});db.collection("suggest").onSnapshot(keep(x=>{DONE={};x.forEach(d=>{DONE[d.id]=1});upd()}))}
 db.collection("catalog").onSnapshot(keep(x=>{R.extra=x.filter(y=>y.name&&y.url);soft()}));
 if(R.uid){
  R.prefsRef=db.collection("data/users/"+R.uid).doc("prefs");
  R.prefsRef.onSnapshot(s=>{R.prefs=s.data()||{};updateBell();if(!document.activeElement?.closest?.("form"))rerender()});
 }
 rerender();
})();
</script>

<div class="inst" id="instBar" hidden><img src="/icon-192.png" alt=""><p id="instTxt"></p><button class="go" id="instGo" type="button" hidden></button><button class="x" id="instX" type="button" aria-label="إغلاق">✕</button></div>
<script>
(function(){
  if ("serviceWorker" in navigator) addEventListener("load", function(){ navigator.serviceWorker.register("/sw.js").catch(function(){}); });
  var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  var seen = false; try { seen = localStorage.getItem("bosla-inst") === "1"; } catch(e) {}
  if (standalone || seen) return;
  var bar = document.getElementById("instBar"), txt = document.getElementById("instTxt"), go = document.getElementById("instGo");
  var ar = (document.documentElement.lang || "ar") !== "en";
  function close(){ bar.hidden = true; try { localStorage.setItem("bosla-inst", "1"); } catch(e) {} }
  document.getElementById("instX").onclick = close;
  var deferred = null;
  addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred = e;
    txt.textContent = ar ? "ثبّت بوصلة على جوالك لتفتحها مثل التطبيق." : "Install Bosla on your phone to open it like an app.";
    go.textContent = ar ? "تثبيت" : "Install"; go.hidden = false; bar.hidden = false;
  });
  go.onclick = function(){ if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(close); };
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (ios) setTimeout(function(){
    txt.textContent = ar ? "لتثبيت بوصلة: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»." : "To install Bosla: tap Share, then \"Add to Home Screen\".";
    bar.hidden = false;
  }, 2500);
})();
</script>

<script>
(function(){
  var cv=document.getElementById('boslaBg'); if(!cv) return;
  var ctx=cv.getContext('2d');
  var NAVY='15,53,87', COPPER='186,103,64', SAGE='94,139,110';
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W,H,DPR,nodes=[],pulses=[],mouse={x:-9999,y:-9999,tx:-9999,ty:-9999};
  var rot=0,needle=0,needleT=0,LINK;

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    LINK=Math.max(110,Math.min(170,W/8));
    var n=Math.round(Math.min(70,Math.max(26,W*H/22000)));
    nodes=[];
    for(var i=0;i<n;i++){
      var r=Math.random();
      nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,
        s:1.2+Math.random()*1.8,c:r<.18?COPPER:(r<.36?SAGE:NAVY)});
    }
  }

  // البوصلة: حلقات، تدريجات، ونجمة الاتجاهات
  function compass(cx,cy,R){
    ctx.save(); ctx.translate(cx,cy);
    ctx.strokeStyle='rgba('+NAVY+',.10)'; ctx.lineWidth=1;
    [1,.82,.5].forEach(function(k){ctx.beginPath();ctx.arc(0,0,R*k,0,7);ctx.stroke();});
    ctx.save(); ctx.rotate(rot);
    for(var i=0;i<72;i++){
      var a=i*Math.PI/36, big=i%9===0, L=big?R*.09:R*.04;
      ctx.strokeStyle='rgba('+NAVY+','+(big?.18:.09)+')';
      ctx.beginPath();ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R);ctx.lineTo(Math.cos(a)*(R-L),Math.sin(a)*(R-L));ctx.stroke();
    }
    // نجمة ثمانية الأطراف
    for(var j=0;j<8;j++){
      var A=j*Math.PI/4, len=j%2?R*.42:R*.74, w=j%2?R*.05:R*.08;
      ctx.save(); ctx.rotate(A);
      ctx.fillStyle='rgba('+(j%2?SAGE:NAVY)+','+(j%2?.07:.06)+')';
      ctx.beginPath();ctx.moveTo(0,-len);ctx.lineTo(w,0);ctx.lineTo(-w,0);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    // الإبرة تتجه نحو المؤشر
    ctx.rotate(needle);
    ctx.fillStyle='rgba('+COPPER+',.32)';
    ctx.beginPath();ctx.moveTo(0,-R*.62);ctx.lineTo(R*.035,0);ctx.lineTo(-R*.035,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba('+NAVY+',.14)';
    ctx.beginPath();ctx.moveTo(0,R*.62);ctx.lineTo(R*.035,0);ctx.lineTo(-R*.035,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba('+COPPER+',.5)';ctx.beginPath();ctx.arc(0,0,R*.02+2,0,7);ctx.fill();
    ctx.restore();
  }

  function frame(t){
    ctx.clearRect(0,0,W,H);
    mouse.x+=(mouse.tx-mouse.x)*.08; mouse.y+=(mouse.ty-mouse.y)*.08;

    // البوصلة الكبيرة: بعيدًا عن جهة النص على الشاشات العريضة، ومنتصفها على الجوال
    var R=Math.min(W,H)*(W>760?.36:.42);
    var cx=W>760?(document.dir==="rtl"?W*.24:W*.76):W*.5, cy=W>760?H*.42:H*.55;
    var px=(mouse.tx>-999?(mouse.x-W/2)*.012:0), py=(mouse.ty>-999?(mouse.y-H/2)*.012:0);
    if(!reduce) rot+=.0006;
    if(mouse.tx>-999) needleT=Math.atan2(mouse.y-cy,mouse.x-cx)+Math.PI/2;
    else needleT=Math.sin(t/4000)*.5;
    var d=needleT-needle; d=Math.atan2(Math.sin(d),Math.cos(d)); needle+=d*.04;
    compass(cx-px,cy-py,R);

    // العُقد: تتحرك ببطء وتتصل بخطوط كأنها مسارات
    for(var i=0;i<nodes.length;i++){
      var a=nodes[i];
      if(!reduce){a.x+=a.vx;a.y+=a.vy;}
      if(a.x<-20)a.x=W+20; if(a.x>W+20)a.x=-20; if(a.y<-20)a.y=H+20; if(a.y>H+20)a.y=-20;
    }
    for(i=0;i<nodes.length;i++){
      a=nodes[i];
      for(var j=i+1;j<nodes.length;j++){
        var b=nodes[j], dx=a.x-b.x, dy=a.y-b.y, dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<LINK){
          ctx.strokeStyle='rgba('+NAVY+','+(.13*(1-dist/LINK))+')'; ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
          if(!reduce&&pulses.length<5&&Math.random()<.0004) pulses.push({a:a,b:b,p:0});
        }
      }
      var mdx=a.x-mouse.x, mdy=a.y-mouse.y, md=Math.sqrt(mdx*mdx+mdy*mdy);
      if(md<LINK*1.4){
        ctx.strokeStyle='rgba('+COPPER+','+(.35*(1-md/(LINK*1.4)))+')';
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();
      }
      ctx.fillStyle='rgba('+a.c+','+(a.c===NAVY?.35:.6)+')';
      ctx.beginPath();ctx.arc(a.x,a.y,a.s,0,7);ctx.fill();
    }

    // نبضات نحاسية تنتقل على المسارات
    for(i=pulses.length-1;i>=0;i--){
      var P=pulses[i]; P.p+=.012;
      if(P.p>=1){pulses.splice(i,1);continue;}
      var x=P.a.x+(P.b.x-P.a.x)*P.p, y=P.a.y+(P.b.y-P.a.y)*P.p;
      var g=ctx.createRadialGradient(x,y,0,x,y,10);
      g.addColorStop(0,'rgba('+COPPER+',.75)'); g.addColorStop(1,'rgba('+COPPER+',0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,10,0,7); ctx.fill();
    }
    if(!reduce) raf=requestAnimationFrame(frame);
  }

  var raf;
  addEventListener('resize',function(){resize(); if(reduce) frame(0);});
  addEventListener('pointermove',function(e){mouse.tx=e.clientX;mouse.ty=e.clientY;if(mouse.x<-999){mouse.x=e.clientX;mouse.y=e.clientY;}},{passive:true});
  document.addEventListener('pointerleave',function(){mouse.tx=mouse.ty=mouse.x=mouse.y=-9999;});
  document.addEventListener('visibilitychange',function(){
    if(reduce) return;
    if(document.hidden) cancelAnimationFrame(raf); else raf=requestAnimationFrame(frame);
  });
  resize(); raf=requestAnimationFrame(frame);
})();
</script>
</body></html>
